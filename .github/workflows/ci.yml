name: CI

# Every push and pull request: tests, a type-check against the engine's SDK, a
# native build for each platform, and a signed .pxext package.
# A tag like v0.1.0 also creates the GitHub release (as a draft, see RELEASE_DRAFT).
# The release needs the repository secret PRISMATIX_SIGNING_KEY: the PEM written by
# `prismatix extension keygen`. See the README, "Releasing a .pxext".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # The engine the extension is built and tested against. @prismatix/cli is not
  # on npm yet, so CI builds it from this commit; bump it deliberately.
  ENGINE_REPOSITORY: PrisX/PrismatiXEngine
  ENGINE_REF: 945b089e07fadcc74acf4e0558e8293f88be576f
  # A draft release is reviewed and published by hand.
  RELEASE_DRAFT: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the bridge, the plugin and the mock Core, run the tests
        run: tools/test.sh

  engine-checks:
    name: type-check and validate against the engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ env.ENGINE_REF }}
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Build the engine's SDK and CLI
        run: tools/build-engine-cli.sh engine
      - name: Type-check against the SDK
        run: |
          ln -s ../engine extension/.engine
          engine/node_modules/.bin/tsc -p extension/tsconfig.check.json
          engine/node_modules/.bin/tsc -p extension/tsconfig.studio.json
      - name: The committed Studio bundle and handler types are up to date
        run: |
          tools/build-studio.sh engine
          git diff --exit-code -- extension/dist extension/prismatix-extension.d.ts ||
            { echo "::error::run tools/build-studio.sh and commit extension/dist/studio.js and extension/prismatix-extension.d.ts"; exit 1; }

  native:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win32-x64, flags: ""}
          - {os: ubuntu-22.04, platform: linux-x64, flags: ""}
          - {os: macos-latest, platform: darwin-arm64, flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"}
          # Built on the Apple Silicon runner; never run in CI.
          - {os: macos-latest, platform: darwin-x64, flags: "-DCMAKE_OSX_ARCHITECTURES=x86_64"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release -DPX_PLATFORM=${{ matrix.platform }} ${{ matrix.flags }}
          cmake --build build --config Release --target px_live2d
      - run: ls -l extension/native/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: extension/native/${{ matrix.platform }}
          if-no-files-found: error

  native-android:
    name: native (android-arm64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin with the NDK (arm64-v8a, API 26, 16 KB pages)
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          [ -n "$ndk" ] && [ -d "$ndk" ] || { echo "::error::no Android NDK on this runner"; exit 1; }
          echo "NDK: $ndk"
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          cmake --build build --target px_live2d
      - name: Check the library's architecture, alignment and exports
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          library=extension/native/android-arm64/libpx_live2d.so
          "$bin/llvm-readelf" -h "$library" | grep -q AArch64
          if "$bin/llvm-readelf" -lW "$library" | awk '$1 == "LOAD" && $NF != "0x4000" {bad = 1} END {exit !bad}'; then
            echo "::error::a LOAD segment is not 16 KB aligned"; exit 1
          fi
          "$bin/llvm-nm" -D --defined-only "$library" | grep -q px_plugin_init
          ls -l extension/native/android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64
          path: extension/native/android-arm64
          if-no-files-found: error

  package:
    name: package (.pxext)
    needs: [test, engine-checks, native, native-android]
    runs-on: ubuntu-22.04
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ env.ENGINE_REF }}
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Build the engine's SDK and CLI
        run: tools/build-engine-cli.sh engine
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts
      - name: Put every platform's library where pack looks for it
        run: |
          for folder in native-artifacts/native-*; do
            platform="${folder##*/native-}"
            mkdir -p "extension/native/$platform"
            cp -r "$folder"/. "extension/native/$platform/"
          done
          find extension/native -type f | sort
      - name: The tag must match the extension's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./extension/live2d-cubism.pxextension').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the manifest version $version"
            exit 1
          fi
      - name: Signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.PRISMATIX_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/signing.pem"
          if [ -n "$SIGNING_KEY" ]; then
            (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::a release needs the repository secret PRISMATIX_SIGNING_KEY (the PEM from 'prismatix extension keygen')"
            exit 1
          else
            # Not a release: a throwaway key proves the packaging works. Users should never see this package.
            node engine/packages/cli/dist/src/cli.js extension keygen "$key" > /dev/null
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no PRISMATIX_SIGNING_KEY secret, so this package is signed with a throwaway key"
          fi
          echo "path=$key" >> "$GITHUB_OUTPUT"
      - name: Validate, pack, and install into a second project
        run: tools/package.sh engine "${{ steps.key.outputs.path }}" release
      - name: Checksums
        run: cd release && sha256sum *.pxext | tee SHA256SUMS.txt
      - name: Remove the key
        if: always()
        run: rm -f "${{ steps.key.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pxext-${{ steps.key.outputs.signed == 'true' && 'signed' || 'unsigned-throwaway-key' }}
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && needs.package.outputs.signed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pxext-signed
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          main="owenliu0924-live2d-cubism-$version.pxext"
          sha="$(sha256sum "release/$main" | cut -d' ' -f1)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cat > notes.md <<NOTES
          Live2D (Cubism) for PrismatiX $version.

          **Install** (needs a PrismatiXEngine with native ABI 1.1, \`userFiles\` and Android native extensions, PrismatiXEngine $ENGINE_REF or later; the package for your platform is looked up beside the main file; add \`--platform android-arm64\` for an Android build):

          \`\`\`sh
          prismatix extension add $base/$main --sha256 $sha --allow-native
          \`\`\`

          **This package contains native code** that runs inside the game process, and **does not contain Live2D's Cubism Core**: download the Cubism SDK for Native from Live2D (read its license) and put the Core library for each platform in your project's \`NativeUserFiles/live2d-cubism/<platform>/\`; \`prismatix pack\` and \`run\` copy it beside the plugin. \`prismatix extension inspect\` lists the file names.

          It also has a Studio side (read-only project access): an inspector for \`.model3.json\` files and dropdowns of motions, expressions and parameters. Studio asks before it loads it.

          Native packs are built for Windows, Linux, macOS (Intel and Apple Silicon) and Android (arm64). CI runs the Linux and Apple Silicon builds against a mock Core; the Windows, Intel macOS and Android builds are compiled but not run there. Before release, Live2D's sample models ran with the real Core (SDK 5-r.5) in the Windows and Android Players; macOS has not been tried. See the README.

          SHA-256 of every file is in \`SHA256SUMS.txt\`.
          NOTES
          draft=()
          if [ "$RELEASE_DRAFT" = "true" ]; then draft=(--draft); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "Live2D (Cubism) $version" \
            --notes-file notes.md --verify-tag "${draft[@]}"
